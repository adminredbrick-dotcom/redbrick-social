<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connected - Red Brick Lettings</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #1d1b1a; background: #f7f2ea; }
  h1 { color: #a63d2f; font-size: 1.6rem; }
  button { font-size: 1.1rem; padding: 10px 22px; background: #a63d2f; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #msg { margin-top: 12px; font-weight: 600; }
</style>
</head>
<body>
<h1>Red Brick Social Poster</h1>
<p id="intro">Approval received. Click the button below, then go back to the CONNECT window and press Enter.</p>
<button id="copy">Copy the code</button>
<p id="msg"></p>
<p><small>This page only copies the one-time code to your clipboard. It does not send it anywhere.</small></p>
<script>
  // Threads adds "#_" after the code; it is not part of the code
  const code = (new URLSearchParams(location.search).get('code') || '').replace(/#_$/, '');
  const err = new URLSearchParams(location.search).get('error_description');
  const msg = document.getElementById('msg');
  if (!code) {
    document.getElementById('copy').style.display = 'none';
    document.getElementById('intro').textContent = err ? 'Threads said: ' + err : 'No code arrived. Run CONNECT THREADS again.';
  }
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(code); msg.textContent = 'Copied. Go back to the CONNECT window and press Enter.'; }
    catch (e) { msg.textContent = 'Could not copy automatically - select this and copy it: ' + code; }
  };
</script>
</body>
</html>
