name: post

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Only check the connection, publish nothing'
        type: boolean
        default: true
      schedule_facebook:
        description: 'Hand future Facebook posts to Facebook''s own scheduler'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post what is due
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python poster/post.py ${{ inputs.test && '--test' || '' }} ${{ inputs.schedule_facebook && '--schedule-facebook' || '' }}
      - name: Save the posted log
        if: ${{ !cancelled() && !inputs.test }}
        run: |
          git config user.name "Red Brick poster"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Posted log" && git push)
